name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen   # GUI 测试统一离屏渲染
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Linux 上 Qt offscreen 渲染所需系统库（EGL/GL/xkbcommon/xcb-cursor 等）
      - name: Install Qt system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (offscreen)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -v --basetemp="${{ runner.temp }}/pytest_tmp" 2>&1 | tee pytest.log

      # 失败时把日志尾部写成注解（check-run annotations 无需登录即可通过 API 读取），
      # 便于在没有仓库 token 的环境里定位崩溃/失败的具体用例
      - name: Report failure tail
        if: failure()
        shell: bash
        run: |
          if [ -f pytest.log ]; then
            echo "=== pytest.log tail (last 60 lines) ==="
            tail -n 60 pytest.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error title=pytest log::$line"
            done
          fi
